name: Release

# Two kinds of build:
#  - a tag vX.Y.Z is the official release: built from the committed version.properties (so F-Droid can reproduce it),
#    signed with the release key (the job fails without it) and published as the latest release;
#  - every other push to master is a "nightly": application id com.qtekfun.ultimatefiles.nightly, published as a pre-release.
on:
  push:
    branches: [master]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Compute version
        id: version
        run: |
          ./scripts/check-version.sh
          base_name="$(sed -n 's/^versionName=//p' version.properties | tr -d '[:space:]')"
          base_code="$(sed -n 's/^versionCode=//p' version.properties | tr -d '[:space:]')"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$base_name" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match versionName $base_name in version.properties"; exit 1
            fi
            echo "official=true" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "asset=UltimateFiles-$base_name.apk" >> "$GITHUB_OUTPUT"
            echo "title=UltimateFiles $base_name" >> "$GITHUB_OUTPUT"
            echo "gradle_args=" >> "$GITHUB_OUTPUT"
          else
            run="${{ github.run_number }}"
            name="$base_name-nightly.$run"
            echo "official=false" >> "$GITHUB_OUTPUT"
            echo "tag=nightly-$run" >> "$GITHUB_OUTPUT"
            echo "asset=UltimateFiles-$name.apk" >> "$GITHUB_OUTPUT"
            echo "title=UltimateFiles nightly $run" >> "$GITHUB_OUTPUT"
            echo "gradle_args=-Pnightly=true -PversionCode=$(( base_code * 100000 + run )) -PversionName=$name" >> "$GITHUB_OUTPUT"
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Decode signing keystore
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ "${{ steps.version.outputs.official }}" = "true" ]; then
            echo "::error::An official release must be signed: set the SIGNING_* secrets (see docs/SIGNING.md)."; exit 1
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SIGNING_KEYSTORE_BASE64 not set; the nightly falls back to the debug key."
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease ${{ steps.version.outputs.gradle_args }}

      - name: Show the signing certificate
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -E "certificate (DN|SHA-256)"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "${{ steps.version.outputs.asset }}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.title }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.official != 'true' }}
          make_latest: ${{ steps.version.outputs.official == 'true' }}
          body: ${{ steps.signing.outputs.signed != 'true' && 'Signed with the debug key because no release keystore is configured. Nightly builds install next to the official app (id com.qtekfun.ultimatefiles.nightly).' || (steps.version.outputs.official != 'true' && 'Nightly build from master; it installs next to the official app (id com.qtekfun.ultimatefiles.nightly).' || '') }}
          files: ${{ steps.version.outputs.asset }}
